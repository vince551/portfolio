<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#0d0d14"/><stop offset="1" stop-color="#171020"/></linearGradient></defs><rect width="1200" height="720" rx="30" fill="#090a0d"/><rect x="28" y="28" width="1144" height="664" rx="20" fill="url(#g)" stroke="#fff" stroke-opacity=".1"/><text x="70" y="82" fill="#8b5cf6" font-family="Arial" font-size="14" font-weight="700">KCA / DIGITAL PLATFORM</text><text x="70" y="145" fill="#fff" font-family="Arial" font-size="43" font-weight="700">A clearer way to connect.</text><text x="70" y="184" fill="#858585" font-family="Arial" font-size="17">A structured interface for information, reporting and community access.</text><rect x="70" y="225" width="1060" height="390" rx="20" fill="#fff" fill-opacity=".03" stroke="#fff" stroke-opacity=".07"/><rect x="100" y="255" width="300" height="330" rx="15" fill="#0a0c12"/><text x="130" y="300" fill="#777" font-family="Arial" font-size="12">QUICK ACCESS</text><text x="130" y="345" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Report an issue</text><text x="130" y="390" fill="#999" font-family="Arial" font-size="14">Submit information securely</text><text x="130" y="412" fill="#999" font-family="Arial" font-size="14">and route it to the right team.</text><rect x="130" y="455" width="220" height="48" rx="12" fill="#8b5cf6" fill-opacity=".2" stroke="#8b5cf6" stroke-opacity=".45"/><text x="175" y="485" fill="#fff" font-family="Arial" font-size="14" font-weight="700">Start a report</text><rect x="430" y="255" width="670" height="150" rx="15" fill="#06b6d4" fill-opacity=".06" stroke="#06b6d4" stroke-opacity=".2"/><text x="465" y="300" fill="#06b6d4" font-family="Arial" font-size="12">INFORMATION HUB</text><text x="465" y="342" fill="#fff" font-family="Arial" font-size="24" font-weight="700">Resources, notices and updates</text><text x="465" y="375" fill="#888" font-family="Arial" font-size="14">A clean information architecture for users who need answers quickly.</text><rect x="430" y="430" width="320" height="156" rx="15" fill="#fff" fill-opacity=".035"/><text x="460" y="470" fill="#777" font-family="Arial" font-size="12">ACCESS</text><text x="460" y="515" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Community</text><text x="460" y="548" fill="#888" font-family="Arial" font-size="13">Guides, contacts and support.</text><rect x="780" y="430" width="320" height="156" rx="15" fill="#ec4899" fill-opacity=".06" stroke="#ec4899" stroke-opacity=".15"/><text x="810" y="470" fill="#f472b6" font-family="Arial" font-size="12">PRIVACY</text><text x="810" y="515" fill="#fff" font-family="Arial" font-size="21" font-weight="700">Responsible design</text><text x="810" y="548" fill="#888" font-family="Arial" font-size="13">Designed around clarity and trust.</text></svg>